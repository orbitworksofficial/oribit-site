<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract migration between two running stacks">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="8%" r="78%">
      <stop offset="0%" stop-color="#fe063b" stop-opacity=".34"/>
      <stop offset="70%" stop-color="#fe063b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#07091e"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Artwork is inset into the 21:9 safe zone: the post header crops this
       16:9 canvas to 21:9, and only the background may be cut. -->
  <g data-safe-zone="" transform="translate(160 90) scale(0.8)">

  <!-- Two of everything, briefly: the old stack and the new one, both running. -->
  <g fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".22" stroke-width="3">
    <rect x="210" y="330" width="290" height="72" rx="10"/>
    <rect x="210" y="428" width="290" height="72" rx="10"/>
    <rect x="210" y="526" width="290" height="72" rx="10"/>
  </g>
  <g fill="#fe063b" fill-opacity=".16" stroke="#fe063b" stroke-opacity=".6" stroke-width="3">
    <rect x="1100" y="330" width="290" height="72" rx="10"/>
    <rect x="1100" y="428" width="290" height="72" rx="10"/>
    <rect x="1100" y="526" width="290" height="72" rx="10"/>
  </g>

  <!-- Status lamps: nothing goes dark during the cutover. -->
  <g fill="#ffffff" fill-opacity=".45">
    <circle cx="256" cy="366" r="8"/><circle cx="256" cy="464" r="8"/><circle cx="256" cy="562" r="8"/>
  </g>
  <g fill="#fe063b">
    <circle cx="1146" cy="366" r="8"/><circle cx="1146" cy="464" r="8"/><circle cx="1146" cy="562" r="8"/>
  </g>

  <!-- Move the boring things first: solid, then in progress, then not yet. -->
  <path d="M500 366c180 0 420-70 600-70" fill="none" stroke="#fe063b" stroke-width="5" stroke-linecap="round"/>
  <path d="M500 464h600" fill="none" stroke="#fe063b" stroke-opacity=".7" stroke-width="5" stroke-linecap="round" stroke-dasharray="34 26"/>
  <path d="M500 562c180 0 420 70 600 70" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 26"/>

  <!-- And the way back, which is what makes it a plan. -->
  <path d="M1100 690c-200 60-420 60-600 0" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>
  <path d="M540 668l-40 22 40 22" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M120 792h150" stroke="#fe063b" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
